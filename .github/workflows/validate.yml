name: validate-plugin

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate manifest + frontmatter
        run: claude plugin validate .
        env:
          # validate is local/static; no model calls needed
          ANTHROPIC_API_KEY: sk-dummy

      - name: Check line limit (<= 200 lines per file)
        run: |
          bad=0
          while IFS= read -r f; do
            n=$(wc -l < "$f")
            if [ "$n" -gt 200 ]; then echo "OVER LIMIT: $f ($n lines)"; bad=1; fi
          done < <(find . -name "*.md" -o -name "*.json" | grep -v node_modules)
          exit $bad

      - name: Lint skill frontmatter (skills.sh parser parity)
        run: |
          npm install --no-save yaml
          node -e "
          const yaml = require('yaml'); const fs = require('fs'); const path = require('path');
          let fail = 0;
          for (const dir of fs.readdirSync('skills')) {
            const f = path.join('skills', dir, 'SKILL.md');
            if (!fs.existsSync(f)) continue;
            const raw = fs.readFileSync(f, 'utf8');
            const m = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)\$/);
            if (!m) { console.error('NO FRONTMATTER:', f); fail = 1; continue; }
            let d;
            try { d = yaml.parse(m[1]); } catch (e) { console.error('YAML FAIL:', f, e.message.split('\n')[0]); fail = 1; continue; }
            if (!d || !d.name || !d.description) { console.error('MISSING name/description:', f); fail = 1; }
          }
          process.exit(fail);
          "